<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Isshin — 3D presence demo</title>
<style>
  :root { --bg:#0b0e14; --ink:#e8e6f0; --dim:#8b87a0; --accent:#9d5cff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
  #avatar { position:fixed; inset:0; }
  #avatar canvas { display:block; }
  #vignette { position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 90% 70% at 50% 38%, transparent 55%, rgba(11,14,20,.88) 100%); }
  #styleBar { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:0; right:0; z-index:6;
    display:flex; justify-content:center; gap:8px; flex-wrap:wrap; padding:0 10px; }
  #styleBar button { border:1px solid rgba(255,255,255,.14); border-radius:999px; padding:8px 14px;
    font-size:13px; font-weight:600; background:rgba(255,255,255,.06); color:var(--dim); cursor:pointer; }
  #styleBar button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #hud { position:fixed; left:0; right:0; bottom:0; padding:18px 20px calc(20px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center; gap:12px; z-index:5; }
  #state { font-size:13px; letter-spacing:.14em; color:var(--dim);
    display:flex; align-items:center; gap:8px; }
  #state .dot { width:8px; height:8px; border-radius:50%; background:#4ade80; transition:background .3s; }
  #state.talking .dot { background:var(--accent); animation:pulse 0.9s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  #sub { min-height:2.6em; font-size:clamp(19px, 5vw, 26px); line-height:1.4; text-align:center;
    max-width:640px; text-wrap:balance; }
  #sub .en { display:block; font-size:.58em; color:var(--dim); margin-top:4px; }
  #controls { display:flex; gap:10px; }
  #controls button { border:0; border-radius:999px; padding:14px 30px; font-size:16px; font-weight:600;
    background:var(--accent); color:#fff; cursor:pointer; }
  #controls button.ghost { background:rgba(255,255,255,.08); color:var(--ink); }
  #controls button:disabled { opacity:.4; }
  #boot { position:fixed; inset:0; display:flex; flex-direction:column; gap:14px; align-items:center;
    justify-content:center; z-index:10; background:rgba(11,14,20,.92); transition:opacity .5s; }
  #boot.gone { opacity:0; pointer-events:none; }
  #boot .ring { width:46px; height:46px; border-radius:50%; border:3px solid rgba(157,92,255,.2);
    border-top-color:var(--accent); animation:spin 0.9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #boot p { color:var(--dim); font-size:14px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@eed58d198076a7e1e825f804802921c4d3804d46/modules/talkinghead.mjs"
} }
</script>
</head>
<body>
<div id="avatar"></div>
<div id="vignette"></div>
<div id="styleBar"></div>
<div id="boot"><div class="ring"></div><p id="bootmsg">アバターをよみこみちゅう…</p></div>
<div id="hud">
  <div id="state"><span class="dot"></span><span id="stateTxt">きいています</span></div>
  <div id="sub"></div>
  <div id="controls">
    <button id="speakBtn">はなして</button>
    <button id="loopBtn" class="ghost">ループ</button>
  </div>
</div>

<script type="module">
import { TalkingHead } from "talkinghead";

/* ---------- 4 avatar styles, anime → realistic (engine's own sample rigs) ----------
   Per-model retarget/baseline values are copied from TalkingHead's siteconfig.js
   so each rig poses correctly. Models pinned to commit eed58d1. */
const GLB = "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@eed58d198076a7e1e825f804802921c4d3804d46/avatars/";

const STYLES = {
  A: { label:"A · Anime", cfg:{ url:GLB+"vroid.glb", body:"F", avatarMood:"happy",
        baseline:{ headRotateX:-0.1, eyeBlinkLeft:0.05, eyeBlinkRight:0.05 } } },
  B: { label:"B · Stylized", cfg:{ url:GLB+"brunette.glb", body:"F", avatarMood:"happy" } },
  C: { label:"C · Semi-real", cfg:{ url:GLB+"avaturn.glb", body:"F", avatarMood:"happy",
        retarget:{ Hips:{y:0.03}, Spine:{y:0.02}, Spine1:{y:0.02,z:0.01}, Spine2:{y:0.02,z:0.01},
          Neck:{z:0.02,y:0.01}, Head:{z:0.02}, LeftShoulder:{rx:-0.5}, RightShoulder:{rx:-0.5},
          scaleToHipsLevel:1.0 },
        baseline:{ headRotateX:-0.05, eyeBlinkLeft:0.15, eyeBlinkRight:0.15 } } },
  D: { label:"D · Realistic", cfg:{ url:GLB+"avatarsdk.glb", body:"M", avatarMood:"neutral",
        retarget:{ Neck:{z:-0.01,rx:-0.15}, Neck1:{z:-0.01,rx:-0.15}, Neck2:{z:-0.01,rx:-0.15},
          LeftShoulder:{rz:-0.3}, RightShoulder:{rz:0.3},
          scaleToEyesLevel:1.0, origin:{y:-0.1} },
        baseline:{ headRotateX:-0.04, eyeBlinkLeft:0.05, eyeBlinkRight:0.05 } } },
};

/* ---------- demo lines (kana-only; EN gloss under) ---------- */
const LINES = [
  { jp:"こんにちは！ わたしは あおい です。", en:"Hi! I'm Aoi." },
  { jp:"きょうは なにを しましたか？", en:"What did you do today?" },
  { jp:"へえ、いいですね。もっと おしえて ください。", en:"Oh nice! Tell me more." },
  { jp:"わたしは えを かくのが すきです。", en:"I love drawing." },
  { jp:"いっしょに にほんごで はなしましょう！", en:"Let's talk in Japanese together!" },
  { jp:"だいじょうぶ、ゆっくりで いいですよ。", en:"It's okay, take your time." },
];

/* ---------- kana → Oculus viseme schedule (mora-timed) ---------- */
const VROWS = [
  ["あいうえお", null], ["かきくけこ","kk"], ["がぎぐげご","kk"],
  ["さしすせそ","SS"], ["ざじずぜぞ","SS"], ["たちつてと","DD"],
  ["だぢづでど","DD"], ["なにぬねの","nn"], ["はひふへほ",null],
  ["ばびぶべぼ","PP"], ["ぱぴぷぺぽ","PP"], ["まみむめも","PP"],
  ["やゆよ",null], ["らりるれろ","RR"], ["わを",null],
];
const KMAP = {};
for (const [row, cons] of VROWS) {
  const vseq = row.length === 3 ? ["aa","U","O"] : ["aa","I","U","E","O"];
  [...row].forEach((k, i) => { KMAP[k] = { c: cons, v: vseq[i] }; });
}
KMAP["し"].c = "CH"; KMAP["じ"].c = "CH"; KMAP["ち"].c = "CH";
KMAP["つ"].c = "SS"; KMAP["ふ"].c = "FF"; KMAP["ぢ"].c = "CH";
const SMALL = { "ゃ":"aa","ゅ":"U","ょ":"O" };
const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));

function kanaToMorae(text) {
  const s = toHira(text); const out = [];
  for (let i = 0; i < s.length; i++) {
    const ch = s[i], nx = s[i+1];
    if (KMAP[ch]) {
      let m = { c: KMAP[ch].c, v: KMAP[ch].v };
      if (nx && SMALL[nx]) { m.v = SMALL[nx]; if (!m.c) m.c = "CH"; i++; }
      out.push(m);
    }
    else if (ch === "ん") out.push({ c: null, v: "nn" });
    else if (ch === "っ") out.push({ c: null, v: "sil" });
    else if (ch === "ー" && out.length) out.push({ c: null, v: out[out.length-1].v });
    else if ("、。！？!?,. ".includes(ch)) out.push({ c: null, v: "sil", pause: true });
  }
  return out;
}

let MORA_MS = parseFloat(localStorage.getItem("d3_moraMs")) || 145; // self-calibrating

function buildVisemes(text) {
  const morae = kanaToMorae(text);
  const visemes = [], vtimes = [], vdurations = [];
  let t = 0;
  for (const m of morae) {
    const dur = m.pause ? MORA_MS * 1.6 : MORA_MS;
    if (m.c && m.v !== "sil") {
      visemes.push(m.c); vtimes.push(t); vdurations.push(dur * 0.35);
      visemes.push(m.v); vtimes.push(t + dur * 0.3); vdurations.push(dur * 0.7);
    } else {
      visemes.push(m.v); vtimes.push(t); vdurations.push(dur);
    }
    t += dur;
  }
  return { visemes, vtimes, vdurations, total: t, moraCount: morae.filter(m => !m.pause).length };
}

/* ---------- TalkingHead setup ---------- */
const nodeAvatar = document.getElementById("avatar");
const bootEl = document.getElementById("boot"), bootMsg = document.getElementById("bootmsg");
const stateEl = document.getElementById("state"), stateTxt = document.getElementById("stateTxt");
const subEl = document.getElementById("sub");
const speakBtn = document.getElementById("speakBtn"), loopBtn = document.getElementById("loopBtn");
const styleBar = document.getElementById("styleBar");

const head = new TalkingHead(nodeAvatar, {
  ttsEndpoint: "/none/",          // unused — we feed speakAudio directly
  lipsyncModules: [],
  cameraView: "upper",
  cameraRotateEnable: false,
  lightAmbientIntensity: 2.2,
  lightDirectIntensity: 22,
});

let speaking = false, loop = false, lineIdx = 0;
let currentStyle = null, switching = false;
async function setStyle(key) {
  if (switching || key === currentStyle) return;
  switching = true;
  speechSynthesis.cancel(); loop = false; loopBtn.textContent = "ループ";
  bootEl.classList.remove("gone");
  bootMsg.textContent = "アバターをよみこみちゅう…";
  try {
    await head.showAvatar(STYLES[key].cfg, ev => {
      if (ev.lengthComputable) bootMsg.textContent =
        "アバターをよみこみちゅう… " + Math.round(ev.loaded / ev.total * 100) + "%";
    });
    currentStyle = key;
    localStorage.setItem("d3_style", key);
    for (const b of styleBar.children) b.classList.toggle("on", b.dataset.k === key);
    bootEl.classList.add("gone");
  } catch (e) {
    bootMsg.textContent = "よみこみエラー: " + (e.message || e);
  }
  switching = false;
}

for (const [key, s] of Object.entries(STYLES)) {
  const b = document.createElement("button");
  b.textContent = s.label; b.dataset.k = key;
  b.onclick = () => setStyle(key);
  styleBar.appendChild(b);
}

await setStyle(localStorage.getItem("d3_style") || "B");

/* ---------- speech: browser TTS audio + our viseme schedule ---------- */
let voiceJa = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith("ja"));
  voiceJa = vs.find(v => /neural|natural|online/i.test(v.name)) || vs[0] || null;
}
pickVoice(); speechSynthesis.onvoiceschanged = pickVoice;

function speakLine(line) {
  return new Promise(resolve => {
    const sched = buildVisemes(line.jp);
    const u = new SpeechSynthesisUtterance(line.jp);
    u.lang = "ja-JP"; if (voiceJa) u.voice = voiceJa;
    u.rate = 1.0; u.pitch = 1.05;
    let t0 = 0;
    u.onstart = () => {
      t0 = performance.now();
      stateEl.classList.add("talking"); stateTxt.textContent = "はなしています";
      subEl.innerHTML = line.jp + '<span class="en">' + line.en + "</span>";
      const buf = head.audioCtx.createBuffer(1,
        Math.ceil((sched.total + 400) * head.audioCtx.sampleRate / 1000), head.audioCtx.sampleRate);
      head.speakAudio({ audio: buf, words: [line.jp], wtimes: [0], wdurations: [sched.total],
        visemes: sched.visemes, vtimes: sched.vtimes, vdurations: sched.vdurations });
    };
    u.onend = u.onerror = () => {
      if (t0 && sched.moraCount > 6) {           // calibrate mora rate from reality
        const measured = (performance.now() - t0) / (sched.total / MORA_MS);
        if (measured > 60 && measured < 320) {
          MORA_MS = MORA_MS * 0.5 + measured * 0.5;
          localStorage.setItem("d3_moraMs", MORA_MS.toFixed(1));
        }
      }
      stateEl.classList.remove("talking"); stateTxt.textContent = "きいています";
      resolve();
    };
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  });
}

async function speakNext() {
  if (speaking) return;
  speaking = true; speakBtn.disabled = true;
  do {
    await speakLine(LINES[lineIdx]);
    lineIdx = (lineIdx + 1) % LINES.length;
    if (loop) await new Promise(r => setTimeout(r, 1200));
  } while (loop);
  speaking = false; speakBtn.disabled = false;
}

speakBtn.onclick = speakNext;
loopBtn.onclick = () => {
  loop = !loop;
  loopBtn.textContent = loop ? "ループ ■" : "ループ";
  if (loop && !speaking) speakNext();
};
</script>
</body>
</html>
