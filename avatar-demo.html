<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Isshin — live avatar demo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#17121f;overflow:hidden;font-family:system-ui,sans-serif}
  #stage{position:relative;height:100%;display:flex;flex-direction:column}
  #aura{position:absolute;inset:0;transition:background 1s;pointer-events:none}
  #avatarWrap{position:relative;flex:1;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
  #avatar{width:min(120vw,120vh);max-width:none;margin-bottom:-6%;
    animation:breathe 4.2s ease-in-out infinite, sway 7s ease-in-out infinite;
    transform-origin:50% 90%}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.014)}}
  @keyframes sway{0%,100%{rotate:-.7deg}50%{rotate:.7deg}}
  #avatar.talking{animation:breathe 4.2s ease-in-out infinite, sway 7s ease-in-out infinite, bob .9s ease-in-out infinite}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -7px}}
  #hud{position:relative;padding:14px 18px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(transparent, #17121fee 30%)}
  #name{font-weight:800;font-size:20px;color:#fff;text-align:center}
  #stateLbl{font-weight:800;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#9d5cff;text-align:center;margin-top:2px}
  #bubble{margin:12px auto 0;max-width:480px;background:#ffffff12;border:1px solid #ffffff22;border-radius:18px 18px 18px 5px;
    padding:13px 17px;color:#fff;font-size:17px;font-weight:700;line-height:1.6;min-height:52px;text-align:center}
  #tap{margin:12px auto 0;display:block;border:none;border-radius:18px;padding:15px 34px;font-size:16px;font-weight:800;color:#fff;
    background:linear-gradient(100deg,#9d5cff,#ff5d9e);box-shadow:0 8px 22px #9d5cff59}
</style></head><body>

Object.values(F).forEach(s=>{const i=new Image();i.src=s;});
const av = document.getElementById('avatar'), aura = document.getElementById('aura'),
      lbl = document.getElementById('stateLbl'), bubble = document.getElementById('bubble');
let speaking=false, cur='base';
function show(f){ if(cur!==f){ cur=f; av.src=F[f]; } }
/* blink loop — never mid-flap */
(function blinkLoop(){ setTimeout(()=>{ if(!speaking){ show('blink'); setTimeout(()=>{ if(!speaking) show('base'); }, 130); } blinkLoop(); }, 2200+Math.random()*2800); })();
/* mouth flap while speaking */
const FLAP=['talk','half','talk','base','half'];
let flapT=null;
function startFlap(){ let i=0; flapT=setInterval(()=>{ show(FLAP[i++%FLAP.length]); }, 115); }
function stopFlap(){ clearInterval(flapT); show('base'); }
function setState(s){
  av.classList.toggle('talking', s==='speaking');
  if(s==='speaking'){ aura.style.background='radial-gradient(ellipse at 50% 35%, #9d5cff30, transparent 65%)'; lbl.textContent='●  はなしています'; lbl.style.color='#c9a2ff'; }
  else if(s==='listening'){ aura.style.background='radial-gradient(ellipse at 50% 35%, #ff5d9e26, transparent 65%)'; lbl.textContent='●  きいています'; lbl.style.color='#ff8fc0'; }
  else { aura.style.background='radial-gradient(ellipse at 50% 35%, #9d5cff14, transparent 65%)'; lbl.textContent='●  かんがえています'; lbl.style.color='#8a7fa8'; }
}
const AUTO = location.search.includes('auto');
function speak(jp){
  speaking=true; setState('speaking'); bubble.textContent=jp; startFlap();
  if(AUTO){ setTimeout(()=>{ speaking=false; stopFlap(); setState('listening'); }, Math.max(2600, jp.length*230)); return; }
  try{
    const u=new SpeechSynthesisUtterance(jp); u.lang='ja-JP'; u.rate=.92;
    u.onend=()=>{ speaking=false; stopFlap(); setState('listening'); };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
    setTimeout(()=>{ if(speaking){ speaking=false; stopFlap(); setState('listening'); } }, Math.max(2600, jp.length*260));
  }catch(e){ setTimeout(()=>{ speaking=false; stopFlap(); setState('listening'); }, 3000); }
}
const LINES=['こんにちは！ あおい です','きょうは いい てんき ですね','あなたの なまえは？','すきな たべものは なんですか'];
let li=0;
document.getElementById('tap').onclick=()=>speak(LINES[li++%LINES.length]);
/* auto demo mode for recording: ?auto */
if(location.search.includes('auto')){
  document.getElementById('tap').style.display='none';
  (async()=>{ const wait=ms=>new Promise(r=>setTimeout(r,ms));
    await wait(1500); setState('thinking'); bubble.textContent='…'; await wait(1400);
    speak(LINES[0]); await wait(3400);
    setState('listening'); await wait(2200);
    setState('thinking'); await wait(1200);
    speak(LINES[3]); await wait(3800); setState('listening');
  })();
}
setState('listening');
</script></body></html>
